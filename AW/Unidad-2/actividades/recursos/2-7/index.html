<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de colores</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #111;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        #container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 100%;
        }

        .square {
            background-color: #1d1d1d;
            box-shadow: 0 0 2px #000;
            margin: 2px;
            width: 36px;
            height: 36px;
            color: #555;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 1s ease;
        }

        .square:hover {
            transition-duration: 0s;
        }

        button {
            margin-top: 20px;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <button id="btnCambiar">Cambiar el color de un cuadrado</button>

    <script src="script.js"></script>
</body>

</html>
