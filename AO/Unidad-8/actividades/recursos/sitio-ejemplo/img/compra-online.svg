<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Compra por internet desde un portátil y un móvil</title>
  <rect width="400" height="300" fill="#fdf0dc"/>
  <!-- portátil -->
  <rect x="70" y="60" width="210" height="140" rx="10" fill="#1d2733"/>
  <rect x="82" y="72" width="186" height="116" rx="4" fill="#ffffff"/>
  <rect x="82" y="72" width="186" height="18" fill="#f2a516"/>
  <g fill="#e1e6ed">
    <rect x="94" y="100" width="50" height="40" rx="4"/>
    <rect x="150" y="100" width="50" height="40" rx="4"/>
    <rect x="206" y="100" width="50" height="40" rx="4"/>
  </g>
  <g fill="#1b7a4f">
    <rect x="94" y="148" width="50" height="14" rx="7"/>
    <rect x="150" y="148" width="50" height="14" rx="7"/>
    <rect x="206" y="148" width="50" height="14" rx="7"/>
  </g>
  <path d="M50 200 h250 l-14 16 h-222 z" fill="#5a6675"/>
  <!-- móvil -->
  <rect x="290" y="110" width="64" height="120" rx="10" fill="#1d2733"/>
  <rect x="297" y="122" width="50" height="94" rx="3" fill="#ffffff"/>
  <rect x="304" y="132" width="36" height="30" rx="3" fill="#e1e6ed"/>
  <rect x="304" y="170" width="36" height="10" rx="5" fill="#1b7a4f"/>
  <!-- carrito -->
  <g fill="none" stroke="#1a4f9c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 238 h20 l16 36 h70 l14 -28 h-92"/>
  </g>
  <circle cx="154" cy="286" r="8" fill="#1a4f9c"/>
  <circle cx="206" cy="286" r="8" fill="#1a4f9c"/>
  <!-- paquete -->
  <rect x="246" y="244" width="46" height="40" rx="4" fill="#c98a3d"/>
  <path d="M246 258 h46 M269 244 v14" stroke="#8a5a22" stroke-width="4"/>
</svg>
