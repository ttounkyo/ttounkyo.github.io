<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Persona con unas gafas de realidad virtual</title>
  <rect width="400" height="300" fill="#dff1f7"/>
  <!-- formas flotantes del mundo virtual -->
  <g fill="none" stroke="#3aa6c9" stroke-width="4" opacity="0.7">
    <rect x="40" y="40" width="44" height="44" rx="6" transform="rotate(-12 62 62)"/>
    <circle cx="335" cy="70" r="24"/>
    <path d="M300 230 l26 -44 l26 44 z"/>
    <path d="M60 230 h40 M80 210 v40"/>
  </g>
  <!-- cuerpo -->
