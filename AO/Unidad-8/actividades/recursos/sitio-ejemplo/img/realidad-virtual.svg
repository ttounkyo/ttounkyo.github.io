  <!-- cuello y cabeza -->
  <rect x="186" y="180" width="28" height="36" rx="10" fill="#e9b48f"/>
  <circle cx="200" cy="140" r="58" fill="#e9b48f"/>
  <path d="M142 136 c0 -44 30 -64 60 -64 s58 22 56 62 c-12 -22 -34 -34 -58 -34 s-46 12 -58 36 z" fill="#3b2a20"/>
  <!-- gafas de realidad virtual -->
  <rect x="134" y="118" width="132" height="54" rx="16" fill="#1d2733"/>
  <rect x="146" y="128" width="108" height="34" rx="10" fill="#3aa6c9"/>
  <path d="M152 140 h30 M218 150 h30" stroke="#dff1f7" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <rect x="124" y="134" width="12" height="22" rx="4" fill="#1d2733"/>
  <rect x="264" y="134" width="12" height="22" rx="4" fill="#1d2733"/>
  <!-- sonrisa -->
  <path d="M182 186 q18 14 36 0" fill="none" stroke="#8a4b33" stroke-width="4" stroke-linecap="round"/>
</svg>
