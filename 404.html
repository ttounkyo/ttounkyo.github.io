<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada</title>
    <!-- GitHub Pages muestra esta página cuando una dirección no existe. Las rutas son absolutas (/AO/...)
         porque puede mostrarse desde cualquier carpeta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
            font-size: 1.0625rem;
            line-height: 1.6;
            color: #1d2733;
            background-color: #f5f7fa;
        }

        .caja {
            max-width: 34rem;
            text-align: center;
        }

        .codigo {
            font-family: "Lexend", sans-serif;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            color: #b45309;
        }

        h1 {
            margin: 0.75rem 0 0.5rem;
            font-family: "Lexend", sans-serif;
            font-size: 1.7rem;
            color: #0f2747;
        }

        p {
            color: #5a6675;
        }

        .enlaces {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .enlaces a {
            padding: 0.55rem 1rem;
            border: 1px solid #e1e6ed;
            border-radius: 0.6rem;
            background-color: white;
            color: #1a4f9c;
            font-weight: 700;
            text-decoration: none;
        }

        .enlaces a.principal {
            background-color: #0f2747;
            border-color: #0f2747;
            color: white;
        }

        .enlaces a:hover {
            border-color: #1a4f9c;
        }
    </style>
</head>

<body>
    <div class="caja">
        <div class="codigo">404</div>
        <h1>Esta página no existe</h1>
        <p>Puede que el enlace esté mal escrito o que la página se haya movido. Elige a dónde quieres ir:</p>
        <div class="enlaces">
            <a class="principal" href="/">Inicio</a>
            <a href="/AO/">Aplicaciones Ofimáticas</a>
            <a href="/AW/">Aplicaciones Web</a>
            <a href="/DES/">Despliegue</a>
        </div>
    </div>
</body>

</html>
